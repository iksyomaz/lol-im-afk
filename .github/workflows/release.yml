name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: .\scripts\build-windows.ps1
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/lol-im-afk.exe
